name: Build iOS IPA (ARM64 Sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios:
    name: Build iOS IPA (ARM64 Unsigned)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ermaymuhasebe-mobil/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: ermaymuhasebe-mobil
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: ⚙️ Setup CocoaPods & Fastlane
        working-directory: ermaymuhasebe-mobil
        run: |
          npx expo prebuild --platform ios --clean

      - name: 🔨 Build iOS App (ARM64 Generic Device)
        working-directory: ermaymuhasebe-mobil/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE="VK.xcworkspace"
            SCHEME="VK"
          else
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          fi
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            clean build

      - name: 📦 Package into IPA (Payload format)
        working-directory: ermaymuhasebe-mobil/ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Packaging App: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -y VK.ipa Payload
          mkdir -p ../../output
          cp VK.ipa ../../output/

      - name: 🚀 Upload VK.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VK-iOS-IPA
          path: output/VK.ipa
          retention-days: 7

      - name: 📢 Release VK.ipa (Public Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest-ios
          name: "VK Mobile iOS IPA (Latest Build)"
          body: "GitHub Actions tarafından derlenen en güncel VK iOS (.ipa) paketi."
          files: output/VK.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
